---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: AVITIMEMBRANESEGMENT
description: |
  Segments whole cells/membranes for one AVITI tile using a named Cellpose
  3.x membrane model (selected per samplesheet row via `membrane_model`),
  from a stacked cell + nucleus + (optional) actin input. Runs in the same
  Cellpose 3.0.7/torch environment as AVITINUCLEARSEGMENT, not the Cellpose
  v4 segment-anything environment used by AVITIWHOLECELLSEGMENT (the
  default whole-cell path when a row leaves `membrane_model` blank). Output
  filename matches the AVITI Cytocanvas viewer contract (<tile>_Cell.tif) so
  it can be published directly under Well<well>/, identically to
  AVITIWHOLECELLSEGMENT.
keywords:
  - AVITI
  - Teton
  - cytoprofiling
  - cellpose
  - membrane segmentation
  - whole-cell segmentation
tools:
  - cellpose:
      description: A generalist algorithm for cell and nucleus segmentation, pinned to 3.0.7 for custom model compatibility
      homepage: https://github.com/MouseLand/cellpose
      documentation: https://cellpose.readthedocs.io/
      tool_dev_url: https://github.com/MouseLand/cellpose
      licence: ["BSD-3-Clause"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/well/tile information, plus the
        per-row membrane_model (already resolved to model_path by the
        caller) and an optional cell_diameter override
        e.g. [ id:'test__WellA1__L1R01C01S1', tile:'L1R01C01S1', membrane_model:'jurkat_v1', cell_diameter:0 ]
  - nucleus_tif:
      type: file
      description: Nucleus channel TIFF for this tile
      pattern: "*.tif"
  - membrane_tif:
      type: file
      description: Cell-paint/membrane channel TIFF for this tile (the script's --cell-tif)
      pattern: "*.tif"
  - actin_tif:
      type: file
      description: |
        Actin channel TIFF for this tile (3-channel mode), or a literal
        "NO_FILE" placeholder in 2-channel cell paint mode
      pattern: "*.tif"
  - model_path:
      type: file
      description: |
        Path to the Cellpose 3.x membrane model file this row's
        membrane_model resolves to under params.aviti_models_dir

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample/well/tile information
        e.g. [ id:'test__WellA1__L1R01C01S1', tile:'L1R01C01S1' ]
  - cell_mask:
      type: file
      description: Whole-cell segmentation mask for this tile, named after the source tile
      pattern: "*_Cell.tif"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@mcmero"
maintainers:
  - "@mcmero"
