# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "aviti_segment"
description: |
  Segments AVITI24 cytoprofiling (Teton/Teton Atlas) runs: discovers wells and
  tiles from an AVITI run directory, segments whole cells with Cellpose v4 SAM
  (or a per-row Cellpose 3.x membrane model) and nuclei with a Cellpose 3.x
  custom model in separate tile-level processes, publishes per-tile masks in
  the AVITI Cytocanvas viewer layout (Well<well>/<tile>_Cell.tif,
  Well<well>/<tile>_Nuclear.tif), then stitches per-tile masks/images into
  per-well outputs so the existing CELLMEASUREMENT/SEGMENTATIONREPORT/
  KRONOS2EMBEDDINGS modules can run unmodified. Additionally, and
  additively, assembles every well's stitched output for a sample into a
  plate-level pyramidal OME-TIFF and merged GeoJSON (params.aviti_plate_assembly),
  so a whole run can be viewed in QuPath at once.
keywords:
  - AVITI
  - Teton
  - cytoprofiling
  - cellpose
  - segment anything
  - nuclear
  - whole-cell
  - stitching
  - measurement
  - plate-level aggregation
components:
  - aviti/discovertiles
  - aviti/mergetilechannels
  - aviti/wholecellsegment
  - aviti/membranesegment
  - aviti/nuclearsegment
  - aviti/stitchwell
  - aviti/assembleplate
  - aviti/mergeplategeojson
  - cellmeasurement
  - segmentationreport
input:
  - ch_aviti_samplesheet:
      type: channel
      description: |
        Channel containing AVITI sample metadata and the AVITI run directory
        Structure: [ val(meta), path(run_dir) ]
        meta.id is the sample name; meta.wells (optional, colon-separated) restricts discovery to specific wells
  - ch_nuclear_model:
      type: channel
      description: |
        Value channel with the staged Cellpose 3.x custom nuclear model file
        (20250212_cellpose_nuc_8diam), shared across all tiles/wells/samples
        Structure: path(model_file)
  - ch_membrane_models_dir:
      type: channel
      description: |
        Value channel with the staged directory of Cellpose 3.x membrane
        model files (params.aviti_models_dir), shared across all tiles/wells/
        samples that set a per-row membrane_model. Empty channel if
        aviti_models_dir is unset (no AVITI row uses membrane_model).
        Structure: path(models_dir)
output:
  - nuclear_segmentation_mask:
      type: file
      description: |
        Channel containing stitched per-well nuclear segmentation mask TIFF files
        Structure: [ val(meta), path(tif) ]
      pattern: "*_nuclear_stitched.tif"
  - wholecell_segmentation_mask:
      type: file
      description: |
        Channel containing stitched per-well whole-cell segmentation mask TIFF files
        Structure: [ val(meta), path(tif) ]
      pattern: "*_cell_stitched.tif"
  - annotations:
      type: file
      description: |
        Channel containing per-well cellmeasurement GeoJSON annotations.
        Well-scoped only -- feeds the top-level KRONOS2EMBEDDINGS join, which
        keys on this exact meta shape, so plate-level annotations are never
        mixed in here (see plate_annotations below).
        Structure: [ val(meta), path(geojson) ]
      pattern: "*.geojson{,.gz}"
  - kronos_input:
      type: file
      description: |
        Channel containing the stitched per-well image and whole-cell mask, for KRONOS2EMBEDDINGS.
        Well-scoped only, for the same reason as annotations above.
        Structure: [ val(meta), path(image_tif), path(cell_mask) ]
  - report:
      type: file
      description: |
        Optional segmentation report HTML files. A mix of per-well reports and
        (when params.aviti_plate_assembly/aviti_plate_report are enabled and a
        sample's row does not restrict wells) plate-level reports.
        Structure: [ val(meta), path(html) ]
      pattern: "*.html"
  - plate_image:
      type: file
      description: |
        Optional (params.aviti_plate_assembly) pyramidal, tiled BigTIFF
        OME-TIFF assembling every well of a sample onto the plate grid.
        Structure: [ val(plate_meta), path(ome_tif) ]
      pattern: "*_plate.ome.tif"
  - plate_layout:
      type: file
      description: |
        Optional (params.aviti_plate_assembly) plate layout CSV
        (well,col,row,x0,y0,width,height) matching plate_image's well placement.
        Structure: [ val(plate_meta), path(csv) ]
      pattern: "*_plate_layout.csv"
  - plate_annotations:
      type: file
      description: |
        Optional (params.aviti_plate_assembly) merged GeoJSON of every cell in
        plate coordinates, plus one labelled rectangle per well.
        Structure: [ val(plate_meta), path(geojson) ]
      pattern: "*_plate.geojson{,.gz}"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@mcmero"
maintainers:
  - "@mcmero"
