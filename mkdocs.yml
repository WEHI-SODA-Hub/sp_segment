site_name: sp_segment
site_description: Cell segmentation and measurement for COMET, MIBI and OPAL multiplex images
site_url: https://wehi-soda-hub.github.io/sp_segment/
repo_url: https://github.com/WEHI-SODA-Hub/sp_segment
repo_name: WEHI-SODA-Hub/sp_segment
edit_uri: edit/dev/docs/
copyright: WEHI SODA Hub. Released under the MIT licence.

docs_dir: docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
exclude_docs: |
  README.md
  requirements.txt
  scripts/

theme:
  name: material
  icon:
    logo: material/microscope
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - github-callouts
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Install and test: getting-started.md
      - Running at WEHI: wehi.md
      - Running the pipeline: usage.md
  - How-to guides:
      - Choose a segmentation method: how-to/choose-segmenter.md
      - Large and dense images: how-to/large-images.md
      - Expand cells: how-to/expand-cells.md
      - Run several methods on one image: how-to/multiple-methods.md
      - KRONOS2 embeddings: how-to/kronos2.md
      - Resume a killed measurement task: how-to/resume-measurement.md
      - View results in QuPath: how-to/qupath.md
  - Reference:
      - Samplesheet: reference/samplesheet.md
      - Parameters: reference/parameters.md
      - Outputs: output.md
      - Resource profiles: reference/profiles.md
  - Background:
      - Cellpose settings: background/cellpose.md
      - Minimum cell area: background/min-area.md
      - Combining membrane channels: background/membrane-channels.md
      - Tiling and straight cell edges: background/tiling-and-straight-edges.md
      - KRONOS2 marker handling: background/kronos2.md
  - Troubleshooting: troubleshooting.md
  - Release notes: changelog.md
  - Citations: citations.md
  - Developer guide:
      - Contributing: developer/contributing.md
      - Architecture: developer/architecture.md
      - Testing: developer/testing.md
      - Documentation: developer/documentation.md
      - Releasing: developer/releasing.md
